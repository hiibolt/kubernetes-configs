apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: hiibolt
  labels:
    app: radarr
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - image: linuxserver/radarr:latest
          name: radarr
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /movies
            - name: transmission
              mountPath: /data
          ports:
            - containerPort: 7878
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
      volumes:
        - name: config
          hostPath:
            path: /var/mnt/media/hiibolt/radarr/config
            type: DirectoryOrCreate
        - name: movies
          hostPath:
            path: /var/mnt/media/hiibolt/media/movies
            type: DirectoryOrCreate
        - name: transmission
          hostPath:
            path: /var/mnt/media/hiibolt/transmission/cache
            type: DirectoryOrCreate
