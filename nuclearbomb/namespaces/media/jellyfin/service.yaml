apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jellyfin"
    tailscale.com/tags: "tag:k8s"
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 8096
    targetPort: 8096
    name: jellyfin-portal
  - protocol: UDP
    port: 7359
    targetPort: 7359
    name: jellyfin-udp
  type: LoadBalancer
  loadBalancerClass: tailscale
