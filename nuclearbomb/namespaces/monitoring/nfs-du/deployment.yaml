apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-du-exporter
  namespace: monitoring
data:
  exporter.py: |
    #!/usr/bin/env python3
    from __future__ import annotations
    import os
    import subprocess
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from pathlib import Path

    ROOT = Path(os.environ.get("NFS_ROOT", "/mnt/meow"))
    INTERVAL = int(os.environ.get("SCAN_INTERVAL", "900"))
    PORT = int(os.environ.get("METRICS_PORT", "9100"))
    LOCK = threading.Lock()
    METRICS = (
        "# HELP nfs_dir_scan_success 1 ok, 0 failed, 2 still scanning.\n"
        "# TYPE nfs_dir_scan_success gauge\n"
        "nfs_dir_scan_success 2\n"
    )

    MEDIA_LIBS = ("tv", "movies")

    def escape(value: str) -> str:
        return value.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "")

    def du_bytes(path: Path) -> int | None:
        proc = subprocess.run(
            ["du", "-sk", str(path)],
            check=False,
            capture_output=True,
            text=True,
        )
        if proc.returncode != 0 or not proc.stdout.strip():
            return None
        return int(proc.stdout.split()[0]) * 1024

    def scan_fs(lines: list[str]) -> None:
        proc = subprocess.run(
            ["df", "-kP", str(ROOT)],
            check=False,
            capture_output=True,
            text=True,
        )
        rows = [ln for ln in proc.stdout.splitlines() if ln.strip()]
        if len(rows) < 2:
            return
        parts = rows[1].split()
        # Filesystem 1K-blocks Used Available Use% Mounted
        size_kib, used_kib, avail_kib = int(parts[1]), int(parts[2]), int(parts[3])
        lines.extend(
            [
                "# HELP nfs_fs_size_bytes Filesystem capacity for the NFS mount.",
                "# TYPE nfs_fs_size_bytes gauge",
                f"nfs_fs_size_bytes {size_kib * 1024}",
                "# HELP nfs_fs_used_bytes Filesystem used bytes for the NFS mount.",
                "# TYPE nfs_fs_used_bytes gauge",
                f"nfs_fs_used_bytes {used_kib * 1024}",
                "# HELP nfs_fs_avail_bytes Filesystem available bytes for the NFS mount.",
                "# TYPE nfs_fs_avail_bytes gauge",
                f"nfs_fs_avail_bytes {avail_kib * 1024}",
            ]
        )

    def scan_media_lib(lib: Path, lines: list[str]) -> int:
        total = 0
        if not lib.is_dir():
            return 0
        kids = sorted(
            p for p in lib.iterdir() if p.is_dir() and not p.name.startswith(".")
        )
        for child in kids:
            size = du_bytes(child)
            if size is None:
                continue
            total += size
            lines.append(
                "nfs_media_item_bytes"
                f'{{library="{escape(lib.name)}",item="{escape(child.name)}"}} {size}'
            )
        return total

    def scan() -> None:
        global METRICS
        started = time.time()
        lines = [
            "# HELP nfs_dir_bytes Top-level NFS directory size in bytes.",
            "# TYPE nfs_dir_bytes gauge",
            "# HELP nfs_media_item_bytes Size of a title under media/tv or media/movies.",
            "# TYPE nfs_media_item_bytes gauge",
            "# HELP nfs_dir_scan_seconds Wall time of the last du walk.",
            "# TYPE nfs_dir_scan_seconds gauge",
            "# HELP nfs_dir_scan_success 1 ok, 0 failed, 2 still scanning.",
            "# TYPE nfs_dir_scan_success gauge",
        ]
        ok = 1
        try:
            if not ROOT.is_dir():
                raise FileNotFoundError(ROOT)
            scan_fs(lines)
            kids = sorted(
                p for p in ROOT.iterdir() if p.is_dir() and not p.name.startswith(".")
            )
            for child in kids:
                if child.name == "media":
                    media_total = 0
                    for lib_name in MEDIA_LIBS:
                        media_total += scan_media_lib(child / lib_name, lines)
                    lines.append(
                        f'nfs_dir_bytes{{path="{escape(child.name)}"}} {media_total}'
                    )
                    continue
                size = du_bytes(child)
                if size is None:
                    continue
                lines.append(
                    f'nfs_dir_bytes{{path="{escape(child.name)}"}} {size}'
                )
        except Exception as exc:
            ok = 0
            print(f"nfs-du scan failed: {exc!r}", flush=True)
        elapsed = time.time() - started
        lines.append(f"nfs_dir_scan_seconds {elapsed:.3f}")
        lines.append(f"nfs_dir_scan_success {ok}")
        body = "\n".join(lines) + "\n"
        with LOCK:
            METRICS = body

    def loop() -> None:
        while True:
            scan()
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self) -> None:
            if self.path not in ("/metrics", "/"):
                self.send_error(404)
                return
            with LOCK:
                data = METRICS.encode()
            self.send_response(200)
            self.send_header(
                "Content-Type", "text/plain; version=0.0.4; charset=utf-8"
            )
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, fmt: str, *args) -> None:
            return

    if __name__ == "__main__":
        threading.Thread(target=loop, daemon=True).start()
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: nfs-du
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nfs-du
    spec:
      containers:
        - name: exporter
          image: python:3.13-alpine
          command:
            - python3
            - /exporter/exporter.py
          env:
            - name: NFS_ROOT
              value: /mnt/meow
            - name: SCAN_INTERVAL
              value: "900"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: nfs
              mountPath: /mnt/meow
              readOnly: true
            - name: exporter
              mountPath: /exporter
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: nfs
          nfs:
            server: 192.168.4.38
            path: /mnt/meow
            readOnly: true
        - name: exporter
          configMap:
            name: nfs-du-exporter
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
    release: kube-prometheus-stack
spec:
  selector:
    app: nfs-du
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: nfs-du
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
