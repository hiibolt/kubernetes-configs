apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: hiibolt
  labels:
    app: transmission
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
        - image: haugene/transmission-openvpn:5.3.2
          name: transmission
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: OPENVPN_PROVIDER
              value: NORDVPN
            - name: OPENVPN_CONFIG
              value: "us9364.nordvpn.com.udp"
            - name: OPENVPN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nordvpn-username
                  key: NORDVPN_USERNAME
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nordvpn-password
                  key: NORDVPN_PASSWORD
            - name: LOCAL_NETWORK
              value: "10.244.0.0/16,10.0.0.0/24,10.1.1.0/24"
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 9091
          resources:
            limits:
              memory: 512Mi
              ephemeral-storage: 1Gi
              cpu: "3"
            requests:
              cpu: 500m
              memory: 64Mi
      volumes:
        - name: data
          hostPath:
            path: /var/mnt/media/hiibolt/transmission/cache
            type: DirectoryOrCreate
      securityContext:
        fsGroup: 1000
