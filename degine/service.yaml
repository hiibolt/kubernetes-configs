apiVersion: v1
kind: Service
metadata:
  name: degine-backend
  namespace: hiibolt
spec:
  selector:
    app: degine-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: degine-frontend
  namespace: hiibolt
spec:
  selector:
    app: degine-frontend
  ports:
    - port: 80
      targetPort: 80
