apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nfs-meow
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nfs-meow.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 40,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 12, "w": 16, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nfs_dir_bytes",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "/mnt/meow folder sizes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 600 },
                  { "color": "red", "value": 1200 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "nfs_dir_scan_seconds",
              "legendFormat": "scan",
              "refId": "A"
            }
          ],
          "title": "last du walk",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 0, "text": "failed" }, "1": { "color": "green", "index": 1, "text": "ok" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 4 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "nfs_dir_scan_success",
              "refId": "A"
            }
          ],
          "title": "scan status",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single" }
          },
          "targets": [
            {
              "expr": "nfs_dir_bytes",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "share of /mnt/meow",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "align": "auto", "filterable": true } }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 5,
          "options": { "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "targets": [
            {
              "expr": "nfs_dir_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "current sizes",
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "pod": true, "service": true, "endpoint": true, "container": true }, "renameByName": { "path": "folder", "Value": "bytes" } } }
          ],
          "type": "table"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["nfs", "storage"],
      "templating": { "list": [] },
      "time": { "from": "now-7d", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "NFS /mnt/meow",
      "uid": "nfs-meow",
      "version": 1
    }
