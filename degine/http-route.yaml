apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: degine
  namespace: hiibolt
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "degine.hiibolt.com"
  rules:
    - backendRefs:
        - name: degine-frontend
          port: 80
