apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-du-exporter
  namespace: monitoring
data:
  exporter.py: |
    #!/usr/bin/env python3
    from __future__ import annotations
    import os
    import subprocess
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from pathlib import Path

    ROOT = Path(os.environ.get("NFS_ROOT", "/mnt/meow"))
    INTERVAL = int(os.environ.get("SCAN_INTERVAL", "900"))
    PORT = int(os.environ.get("METRICS_PORT", "9100"))
    LOCK = threading.Lock()
    METRICS = (
        "# HELP nfs_dir_bytes Top-level NFS directory size in bytes.\n"
        "# TYPE nfs_dir_bytes gauge\n"
        "nfs_dir_scan_success 0\n"
    )

    def escape(value: str) -> str:
        return value.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "")

    def scan() -> None:
        global METRICS
        started = time.time()
        lines = [
            "# HELP nfs_dir_bytes Top-level NFS directory size in bytes.",
            "# TYPE nfs_dir_bytes gauge",
            "# HELP nfs_dir_scan_seconds Wall time of the last du walk.",
            "# TYPE nfs_dir_scan_seconds gauge",
            "# HELP nfs_dir_scan_success 1 if the last walk finished.",
            "# TYPE nfs_dir_scan_success gauge",
        ]
        ok = 1
        try:
            if not ROOT.is_dir():
                raise FileNotFoundError(ROOT)
            kids = sorted(
                p for p in ROOT.iterdir() if p.is_dir() and not p.name.startswith(".")
            )
            for child in kids:
                proc = subprocess.run(
                    ["du", "-sk", str(child)],
                    check=False,
                    capture_output=True,
                    text=True,
                )
                if proc.returncode != 0 or not proc.stdout.strip():
                    continue
                kib = int(proc.stdout.split()[0])
                lines.append(
                    f'nfs_dir_bytes{{path="{escape(child.name)}"}} {kib * 1024}'
                )
        except Exception:
            ok = 0
        elapsed = time.time() - started
        lines.append(f"nfs_dir_scan_seconds {elapsed:.3f}")
        lines.append(f"nfs_dir_scan_success {ok}")
        body = "\n".join(lines) + "\n"
        with LOCK:
            METRICS = body

    def loop() -> None:
        while True:
            scan()
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self) -> None:
            if self.path not in ("/metrics", "/"):
                self.send_error(404)
                return
            with LOCK:
                data = METRICS.encode()
            self.send_response(200)
            self.send_header(
                "Content-Type", "text/plain; version=0.0.4; charset=utf-8"
            )
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, fmt: str, *args) -> None:
            return

    if __name__ == "__main__":
        threading.Thread(target=loop, daemon=True).start()
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: nfs-du
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nfs-du
    spec:
      containers:
        - name: exporter
          image: python:3.13-alpine
          command:
            - python3
            - /exporter/exporter.py
          env:
            - name: NFS_ROOT
              value: /mnt/meow
            - name: SCAN_INTERVAL
              value: "900"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: nfs
              mountPath: /mnt/meow
              readOnly: true
            - name: exporter
              mountPath: /exporter
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: nfs
          nfs:
            server: 192.168.4.38
            path: /mnt/meow
            readOnly: true
        - name: exporter
          configMap:
            name: nfs-du-exporter
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
    release: kube-prometheus-stack
spec:
  selector:
    app: nfs-du
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nfs-du
  namespace: monitoring
  labels:
    app: nfs-du
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: nfs-du
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
