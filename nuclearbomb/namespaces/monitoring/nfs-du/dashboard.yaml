apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nfs-meow
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nfs-meow.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.75 },
                  { "color": "red", "value": 0.9 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "id": 6,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [
            {
              "expr": "nfs_fs_used_bytes / nfs_fs_size_bytes",
              "legendFormat": "used",
              "refId": "A"
            }
          ],
          "title": "disk used vs size",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 7,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value_and_name" },
          "targets": [
            { "expr": "nfs_fs_used_bytes", "legendFormat": "used", "refId": "A" },
            { "expr": "nfs_fs_size_bytes", "legendFormat": "size", "refId": "B" },
            { "expr": "nfs_fs_avail_bytes", "legendFormat": "free", "refId": "C" }
          ],
          "title": "capacity",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 600 }, { "color": "red", "value": 1200 }] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "nfs_dir_scan_seconds", "legendFormat": "scan", "refId": "A" }],
          "title": "last du walk",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 0, "text": "failed" }, "1": { "color": "green", "index": 1, "text": "ok" }, "2": { "color": "yellow", "index": 2, "text": "scanning" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }, { "color": "yellow", "value": 2 }] } } }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "nfs_dir_scan_success", "refId": "A" }],
          "title": "scan status",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 40,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "normal" },
                "scaleDistribution": { "type": "linear" }
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 10, "w": 16, "x": 0, "y": 8 },
          "id": 1,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "nfs_dir_bytes", "legendFormat": "{{path}}", "refId": "A" }
          ],
          "title": "/mnt/meow folder sizes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 10, "w": 8, "x": 16, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [{ "expr": "nfs_dir_bytes", "legendFormat": "{{path}}", "refId": "A" }],
          "title": "share of /mnt/meow",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 0,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 12, "w": 12, "x": 0, "y": 18 },
          "id": 8,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "topk(20, nfs_media_item_bytes{library=\"tv\"})",
              "legendFormat": "{{item}}",
              "refId": "A"
            }
          ],
          "title": "media/tv (top 20 shows)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 0,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 12, "w": 12, "x": 12, "y": 18 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "topk(20, nfs_media_item_bytes{library=\"movies\"})",
              "legendFormat": "{{item}}",
              "refId": "A"
            }
          ],
          "title": "media/movies (top 20)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "align": "auto", "filterable": true } }
          },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 30 },
          "id": 10,
          "options": { "showHeader": true, "sortBy": [{ "desc": true, "displayName": "bytes" }] },
          "targets": [
            {
              "expr": "nfs_media_item_bytes{library=\"tv\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "all tv titles",
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "pod": true, "service": true, "endpoint": true, "container": true, "library": true }, "renameByName": { "item": "show", "Value": "bytes" } } }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "align": "auto", "filterable": true } }
          },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 30 },
          "id": 11,
          "options": { "showHeader": true, "sortBy": [{ "desc": true, "displayName": "bytes" }] },
          "targets": [
            {
              "expr": "nfs_media_item_bytes{library=\"movies\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "all movies",
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "pod": true, "service": true, "endpoint": true, "container": true, "library": true }, "renameByName": { "item": "movie", "Value": "bytes" } } }
          ],
          "type": "table"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["nfs", "storage"],
      "templating": { "list": [] },
      "time": { "from": "now-7d", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "NFS /mnt/meow",
      "uid": "nfs-meow",
      "version": 2
    }
