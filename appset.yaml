apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hiibolt
  namespace: argocd
spec:
  goTemplate: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - git:
        repoURL: https://github.com/hiibolt/kubernetes-configs.git
        revision: HEAD
        directories:
          - path: '*'
  template:
    metadata:
      name: 'hiibolt-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/hiibolt/kubernetes-configs.git
        path: '{{.path.path}}'
        targetRevision: HEAD
      destination:
        server: https://kubernetes.default.svc
        namespace: hiibolt
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
