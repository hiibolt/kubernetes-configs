apiVersion: apps/v1
kind: Deployment
metadata:
  name: degine-backend
  namespace: default
  labels:
    app: degine-backend
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: degine-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: degine-backend
    spec:
      containers:
        - name: degine-backend
          image: ghcr.io/hiibolt/degine-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BIND
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: BIND
            - name: SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: SUPABASE_URL
            - name: DATABASE_CA
              value: /etc/degine/pooler-root.pem
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: degine-database
                  key: DATABASE_URL
          volumeMounts:
            - name: ca
              mountPath: /etc/degine
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: ca
          configMap:
            name: degine
            items:
              - key: pooler-root.pem
                path: pooler-root.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: degine-frontend
  namespace: default
  labels:
    app: degine-frontend
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: degine-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: degine-frontend
    spec:
      containers:
        - name: degine-frontend
          image: ghcr.io/hiibolt/degine-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: BACKEND_URL
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: API_URL
            - name: WS_URL
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: WS_URL
            - name: SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: SUPABASE_URL
            - name: SUPABASE_KEY
              valueFrom:
                configMapKeyRef:
                  name: degine
                  key: SUPABASE_KEY
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
