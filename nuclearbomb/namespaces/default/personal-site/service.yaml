apiVersion: v1
kind: Service
metadata:
  name: personal-site
  namespace: default
spec:
  selector:
    app: personal-site
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: personal-site-lb
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: personal-site
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP